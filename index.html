<!DOCTYPE html>

<html class="scroll-smooth dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Okechukwu Fidelis Amadi — Frontend &amp; Mobile Developer</title>
<link href="assets/img/favicon.png" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CDN — must load BEFORE js/tailwind-config.js -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="js/tailwind-config.js"></script>
<!-- Site styles -->
<link href="css/styles.css" rel="stylesheet"/>
<script>
  // Hide partial slots only when JS is available to reveal them.
  document.documentElement.classList.add('js-enabled');
</script>
<!-- Site scripts (deferred: run after HTML is parsed) -->
<script defer="" src="js/main.js"></script>
<script defer="" src="js/includes.js"></script>
</head>
<body class="bg-background font-body text-sm md:text-base text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-white relative">
<!-- Ambient Kinetic Gradient Background Orbs -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-40 left-1/4 w-[600px] h-[600px] bg-cyan-500/5 rounded-full blur-[140px]"></div>
<div class="absolute top-1/3 -right-40 w-[500px] h-[500px] bg-emerald-500/5 rounded-full blur-[130px]"></div>
<div class="absolute bottom-1/4 left-[-100px] w-[550px] h-[550px] bg-cyan-600/5 rounded-full blur-[140px]"></div>
</div>

<!-- Each section below is injected at runtime from /partials/ by js/includes.js.
     Edit the matching file in /partials/ to change a section's content. -->

<!-- 1. Sticky Obsidian Kinetic Navigation -->
<!-- sticky lives on the wrapper itself: a sticky element can only
     travel within its own parent's box, so the parent must be the
     full-height page container, not a short slot div. -->
<div class="section-slot sticky top-0 inset-x-0 z-50" data-include="partials/header.html"></div>

<!-- Main Content Flow -->
<main class="relative z-10 w-full pt-10 pb-24 max-w-6xl mx-auto px-6 flex-1 space-y-28">
<!-- 2. Hero Section -->
<div class="section-slot" data-include="partials/hero.html"></div>
<!-- 3. Selected Work & Capabilities Showcase -->
<div class="section-slot" data-include="partials/work.html"></div>
<!-- 4. Technical Arsenal & Tools -->
<div class="section-slot" data-include="partials/skills.html"></div>
<!-- 5. Professional Experience -->
<div class="section-slot" data-include="partials/experience.html"></div>
<!-- 6. Profile & Background (About Okechukwu & Education) -->
<div class="section-slot" data-include="partials/about.html"></div>
<!-- 7. Contact / Project Inquiry Section -->
<div class="section-slot" data-include="partials/contact.html"></div>
</main>
<!-- 8. Obsidian Kinetic Footer -->
<div class="section-slot" data-include="partials/footer.html"></div>
<!-- Toast notification (shown by js/main.js after a form submission) -->
<div aria-live="polite" class="toast" id="toast" role="status"></div>
<!-- Floating action button (FAB): expands to reveal section links.
     Contact is deliberately excluded — the inquiry form itself lives
     in the contact section; no separate link needed. -->
<div class="fab-root" id="fab">
<div aria-hidden="true" class="fab-actions">
<a class="fab-action" href="#work" tabindex="-1">
<span class="fab-label">Work</span>
<span aria-hidden="true" class="material-symbols-outlined">work</span>
</a>
<a class="fab-action" href="#skills" tabindex="-1">
<span class="fab-label">Skills</span>
<span aria-hidden="true" class="material-symbols-outlined">bolt</span>
</a>
<a class="fab-action" href="#experience" tabindex="-1">
<span class="fab-label">Experience</span>
<span aria-hidden="true" class="material-symbols-outlined">timeline</span>
</a>
<a class="fab-action" href="#about" tabindex="-1">
<span class="fab-label">About</span>
<span aria-hidden="true" class="material-symbols-outlined">person</span>
</a>
</div>
<button aria-controls="fab" aria-expanded="false" aria-label="Open section navigation" class="fab-trigger" id="fab-trigger" type="button">
<!-- FAB trigger icon: a plain + sign when closed; opening the menu
     awakens Itachi's Mangekyou Sharingan (three-arm shuriken) —
     pure SVG + CSS, in the site's cyan/violet palette. -->
<span aria-hidden="true" class="fab-icon-plus material-symbols-outlined">add</span>
<svg aria-hidden="true" class="fab-eye" focusable="false" viewBox="-12 -12 24 24">
<defs>
<!-- Three slightly different cyan→violet ramps so the arms read
     as distinct at a glance (lighter / base / deeper). -->
<linearGradient id="fabBladeA" x1="0" y1="1" x2="0.4" y2="0">
<stop offset="0%" stop-color="#22d3ee"/>
<stop offset="100%" stop-color="#a855f7"/>
</linearGradient>
<linearGradient id="fabBladeB" x1="0" y1="1" x2="0.4" y2="0">
<stop offset="0%" stop-color="#67e8f9"/>
<stop offset="100%" stop-color="#c084fc"/>
</linearGradient>
<linearGradient id="fabBladeC" x1="0" y1="1" x2="0.4" y2="0">
<stop offset="0%" stop-color="#0891b2"/>
<stop offset="100%" stop-color="#8b5cf6"/>
</linearGradient>
</defs>
<!-- Mangekyou (open state): Itachi's pattern — a connected
     three-arm shuriken. Pointed claw tips at the rim, concave
     trailing edges carving notches between arms, all merging
     into a solid hub around the pupil. Each arm carries its
     own gradient ramp. -->
<g class="eye-mangekyou">
<circle fill="#0b0c10" r="10.4" stroke="rgba(168,85,247,0.65)" stroke-width="0.9"/>
<g class="blade-spin">
<path d="M 0 -10.2 C 3.4 -9.0 4.8 -5.4 3.8 -2.2 C 3.3 -1.1 2.2 -0.7 0.9 -0.8 C -0.8 -0.9 -2.0 -1.6 -2.3 -3.0 C -1.7 -5.2 -1.0 -7.6 0 -10.2 Z" fill="url(#fabBladeA)"/>
<path d="M 0 -10.2 C 3.4 -9.0 4.8 -5.4 3.8 -2.2 C 3.3 -1.1 2.2 -0.7 0.9 -0.8 C -0.8 -0.9 -2.0 -1.6 -2.3 -3.0 C -1.7 -5.2 -1.0 -7.6 0 -10.2 Z" fill="url(#fabBladeB)" transform="rotate(120)"/>
<path d="M 0 -10.2 C 3.4 -9.0 4.8 -5.4 3.8 -2.2 C 3.3 -1.1 2.2 -0.7 0.9 -0.8 C -0.8 -0.9 -2.0 -1.6 -2.3 -3.0 C -1.7 -5.2 -1.0 -7.6 0 -10.2 Z" fill="url(#fabBladeC)" transform="rotate(240)"/>
<circle r="2.6" fill="url(#fabBladeA)" opacity="0.9"/>
</g>
<circle fill="#e9d5ff" r="1.5"/>
<circle fill="none" r="1.5" stroke="#071018" stroke-width="0.7"/>
</g>
</svg>
</button>
</div>
</body></html>
